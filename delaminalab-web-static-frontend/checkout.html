<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shipping information — de la Mina Lab." />
    <title>Shipping Information — de la Mina Lab</title>
    <link rel="stylesheet" href="cart.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html" aria-label="de la Mina Lab home">DE LA MINA LAB</a>
        <nav class="checkout-nav" aria-label="Primary navigation">
          <a href="cart.html">Cart (1)</a>
        </nav>
      </div>
    </header>

    <main id="main" class="checkout-main">
      <div class="container">
        <div class="checkout-col">
          <p class="checkout-step">02</p>
          <h1>Shipping information</h1>

          <form class="checkout-form" action="#" onsubmit="return false;">
            <div class="checkout-field">
              <label for="ship-email">Email address</label>
              <div class="field-with-icon is-valid">
                <input id="ship-email" type="email" value="jose.garcia@email.com" autocomplete="email" />
                <span class="field-icon" aria-hidden="true">✓</span>
              </div>
            </div>
            <div class="checkout-field">
              <label for="ship-name">Full name</label>
              <input id="ship-name" type="text" value="Jose Garcia" autocomplete="name" />
            </div>
            <div class="checkout-field">
              <label for="ship-address">Address</label>
              <input id="ship-address" type="text" value="Rua da Liberdade, 45" autocomplete="address-line1" />
            </div>
            <div class="checkout-field">
              <label for="ship-address2">Apartment, suite, etc. (optional)</label>
              <input id="ship-address2" type="text" value="2º D" autocomplete="address-line2" />
            </div>
            <div class="checkout-field-row">
              <div class="checkout-field">
                <label for="ship-postal">Postal Code</label>
                <input id="ship-postal" type="text" value="1200-250" autocomplete="postal-code" />
              </div>
              <div class="checkout-field">
                <label for="ship-city">City</label>
                <input id="ship-city" type="text" value="Lisboa" autocomplete="address-level2" />
              </div>
            </div>
            <div class="checkout-field">
              <label for="ship-country">Country / Region</label>
              <select id="ship-country" autocomplete="country">
                <option>Portugal</option>
                <option>Spain</option>
                <option>France</option>
                <option>Germany</option>
                <option>United Kingdom</option>
              </select>
            </div>

            <button type="submit" class="checkout-btn" onclick="window.location.href='checkout-method.html'; return false;">Continue to payment</button>
          </form>

          <a class="checkout-back" href="cart.html"><span aria-hidden="true">←</span> Back to cart</a>
        </div>
      </div>
    </main>

    <footer class="site-footer checkout-footer">
      <div class="container checkout-footer-inner">
        <div class="footer-brand">
          <span class="brand">DE LA MINA LAB</span>
          <p>A creative laboratory based on discovery and collaboration.</p>
        </div>
        <form class="footer-newsletter" action="#" onsubmit="return false;">
          <p class="eyebrow">Stay updated</p>
          <div class="newsletter-field">
            <label class="sr-only" for="newsletter-email">Email address</label>
            <input id="newsletter-email" type="email" placeholder="Your email" autocomplete="email" />
            <button type="submit" aria-label="Subscribe"><span aria-hidden="true">→</span></button>
          </div>
        </form>
        <div class="footer-links-inline">
          <a href="https://instagram.com/delaminalab" target="_blank" rel="noopener">Instagram</a>
          <a href="https://tiktok.com/@delaminalab" target="_blank" rel="noopener">TikTok</a>
          <a href="mailto:hello@delaminalab.com">Email</a>
        </div>
      </div>
    </footer>
  </body>
</html>
