<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shipping method — de la Mina Lab." />
    <title>Shipping Method — de la Mina Lab</title>
    <link rel="stylesheet" href="checkout.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html" aria-label="de la Mina Lab home">DE LA MINA LAB</a>
        <nav class="checkout-nav" aria-label="Primary navigation">
          <a href="cart.html">Cart (1)</a>
        </nav>
      </div>
    </header>

    <main id="main" class="checkout-main">
      <div class="container">
        <div class="checkout-col">
          <p class="checkout-step">03</p>
          <h1>Shipping method</h1>
          <p class="checkout-sublabel" style="margin-bottom:1.5rem;">Choose your shipping option</p>

          <form class="checkout-form" action="#" onsubmit="return false;">
            <div class="method-options">
              <label class="method-option">
                <span class="method-option-left">
                  <input type="radio" name="shipping-method" checked />
                  <span>
                    <span class="method-option-title">Standard Shipping</span>
                    <span class="method-option-sub">3&ndash;5 business days</span>
                  </span>
                </span>
                <span class="method-option-price">€4,90</span>
              </label>
              <label class="method-option">
                <span class="method-option-left">
                  <input type="radio" name="shipping-method" />
                  <span>
                    <span class="method-option-title">Express Shipping</span>
                    <span class="method-option-sub">1&ndash;2 business days</span>
                  </span>
                </span>
                <span class="method-option-price">€8,90</span>
              </label>
              <label class="method-option">
                <span class="method-option-left">
                  <input type="radio" name="shipping-method" />
                  <span>
                    <span class="method-option-title">Pick up in store</span>
                    <span class="method-option-sub">Lisboa</span>
                  </span>
                </span>
                <span class="method-option-price">Free</span>
              </label>
            </div>

            <button type="submit" class="checkout-btn" onclick="window.location.href='checkout-payment.html'; return false;" style="margin-top:1.75rem;">Continue to payment</button>
          </form>

          <a class="checkout-back" href="checkout-shipping.html"><span aria-hidden="true">←</span> Back</a>
        </div>
      </div>
    </main>

    <footer class="site-footer checkout-footer">
      <div class="container checkout-footer-inner">
        <div class="footer-brand">
          <span class="brand">DE LA MINA LAB</span>
          <p>A creative laboratory based on discovery and collaboration.</p>
        </div>
        <form class="footer-newsletter" action="#" onsubmit="return false;">
          <p class="eyebrow">Stay updated</p>
          <div class="newsletter-field">
            <label class="sr-only" for="newsletter-email">Email address</label>
            <input id="newsletter-email" type="email" placeholder="Your email" autocomplete="email" />
            <button type="submit" aria-label="Subscribe"><span aria-hidden="true">→</span></button>
          </div>
        </form>
        <div class="footer-links-inline">
          <a href="https://instagram.com/delaminalab" target="_blank" rel="noopener">Instagram</a>
          <a href="https://tiktok.com/@delaminalab" target="_blank" rel="noopener">TikTok</a>
          <a href="mailto:hello@delaminalab.com">Email</a>
        </div>
      </div>
    </footer>
  </body>
</html>
