<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Payment — de la Mina Lab." />
    <title>Payment — de la Mina Lab</title>
    <link rel="stylesheet" href="cart.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html" aria-label="de la Mina Lab home">DE LA MINA LAB</a>
        <nav class="checkout-nav" aria-label="Primary navigation">
          <a href="cart.html">Cart (1)</a>
        </nav>
      </div>
    </header>

    <main id="main" class="checkout-main">
      <div class="container">
        <div class="checkout-col">
          <p class="checkout-step">04</p>
          <h1>Payment</h1>
          <p class="checkout-sublabel" style="margin-bottom:1.5rem;">All transactions are secure and encrypted.</p>

          <form class="checkout-form" action="#" onsubmit="return false;">
            <div class="checkout-field">
              <label for="pay-card">Card number</label>
              <div class="field-with-icon">
                <input id="pay-card" type="text" value="4242 4242 4242 4242" autocomplete="cc-number" />
                <span class="card-badge">VISA</span>
              </div>
            </div>
            <div class="checkout-field">
              <label for="pay-name">Name on card</label>
              <input id="pay-name" type="text" value="Jose Garcia" autocomplete="cc-name" />
            </div>
            <div class="checkout-field-row">
              <div class="checkout-field">
                <label for="pay-exp">Expiration date</label>
                <input id="pay-exp" type="text" value="12 / 27" autocomplete="cc-exp" />
              </div>
              <div class="checkout-field">
                <label for="pay-cvc">CVC</label>
                <div class="field-with-icon">
                  <input id="pay-cvc" type="text" value="123" autocomplete="cc-csc" />
                  <span class="field-icon" aria-hidden="true">?</span>
                </div>
              </div>
            </div>

            <label class="checkbox-field">
              <input type="checkbox" checked />
              Save card for future purchases
            </label>

            <div class="wallet-row">
              <button type="button" class="wallet-btn"> Apple Pay</button>
              <button type="button" class="wallet-btn"> Google Pay</button>
            </div>

            <button type="submit" class="checkout-btn" onclick="window.location.href='checkout-confirmed.html'; return false;">Pay €34,90</button>
          </form>

          <a class="checkout-back" href="checkout-method.html"><span aria-hidden="true">←</span> Back</a>
        </div>
      </div>
    </main>

    <footer class="site-footer checkout-footer">
      <div class="container checkout-footer-inner">
        <div class="footer-brand">
          <span class="brand">DE LA MINA LAB</span>
          <p>A creative laboratory based on discovery and collaboration.</p>
        </div>
        <form class="footer-newsletter" action="#" onsubmit="return false;">
          <p class="eyebrow">Stay updated</p>
          <div class="newsletter-field">
            <label class="sr-only" for="newsletter-email">Email address</label>
            <input id="newsletter-email" type="email" placeholder="Your email" autocomplete="email" />
            <button type="submit" aria-label="Subscribe"><span aria-hidden="true">→</span></button>
          </div>
        </form>
        <div class="footer-links-inline">
          <a href="https://instagram.com/delaminalab" target="_blank" rel="noopener">Instagram</a>
          <a href="https://tiktok.com/@delaminalab" target="_blank" rel="noopener">TikTok</a>
          <a href="mailto:hello@delaminalab.com">Email</a>
        </div>
      </div>
    </footer>
  </body>
</html>
