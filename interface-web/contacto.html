<!DOCTYPE html> 
<html lang="en"></html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto Ipluso</title>


    <link rel="stylesheet" href="contacto.css">
</head>
<body>
    <header>
        <h1>IPLUSO</h1>
        
        <div class="menu">
            <p><a href="#">Home</a></p>
            <p><a href="#">Sobre</a></p>
            <p><a href="#">Produtos</a></p>
            <p><a href="#">Contactos</a></p>
        </div>
        
            
    </header>        

    <main>
        <div>

        
        <h1>Fale Conosco</h1>
    

        <p class="paragrafo">
            Para entrar em contacto connosco, por favor utilize o formulário abaixo.   
        </p>
        
        <form action="#" method="post" class="form-contacto">
            <label class="label" for="name">Nome:</label><br>
            <input class="input" type="text" id="name" name="name" required><br><br>

            <label class="label"  for="email">Email:</label><br>
            <input class="input" type="email" id="email" name="email" required><br><br>

            <label class="label" for="message">Mensagem:</label><br>
            <textarea class="msg" id="message" name="message" rows="4" cols="50" required></textarea><br><br>

            <input class="btn" type="submit" value="Enviar">
        </form>   
        
        </div>

    </main> 


    <footer>
        <div class="menu">
            <div class="menu-footer">
                <p>Historia</p>
                <p>Termos e Serviços</p>
                <p>Politica de Privacidade</p>  
            </div>
            <div class="menu-footer">
                <p>Contato</p>
                <p>Suporte</p>
                <p>Localização</p>
            </div>
        </div>
    </footer>
</body>
</html>
